<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GraphQL-Ruby Benchmarks</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11, 11, 11, 0.10);
    --hover: rgba(11, 11, 11, 0.04);
    --link: #256abf;
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --better: #006300;
    --worse: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --text-primary: #f0efec;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
      --grid: #2c2c2a;
      --axis: #383835;
      --border: rgba(255, 255, 255, 0.10);
      --hover: rgba(255, 255, 255, 0.05);
      --link: #6da7ec;
      --series-1: #3987e5;
      --series-2: #d95926;
      --better: #0ca30c;
      --worse: #e66767;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --text-primary: #f0efec;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --hover: rgba(255, 255, 255, 0.05);
    --link: #6da7ec;
    --series-1: #3987e5;
    --series-2: #d95926;
    --better: #0ca30c;
    --worse: #e66767;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 32px 16px 64px; }

  header { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 24px; margin-bottom: 24px; }
  header .title { flex: 1 1 320px; }
  h1 { font-size: 24px; margin: 0 0 4px; font-weight: 650; }
  .meta { color: var(--text-secondary); font-size: 13px; margin: 0; }
  .toolbar { display: flex; gap: 8px; }
  button {
    font: inherit; font-size: 13px;
    color: var(--text-primary);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 10px;
    cursor: pointer;
  }
  button:hover { background: var(--hover); }

  h2 {
    font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--text-muted); margin: 28px 0 8px;
  }
  .list { border: 1px solid var(--border); border-radius: 10px; background: var(--surface); overflow: hidden; }

  details { scroll-margin-top: 16px; }
  details + details { border-top: 1px solid var(--border); }
  summary {
    list-style: none;
    cursor: pointer;
    display: grid;
    grid-template-columns: 16px minmax(0, 1fr) 190px 190px;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
  }
  summary::-webkit-details-marker { display: none; }
  summary:hover { background: var(--hover); }
  summary:focus-visible { outline: 2px solid var(--link); outline-offset: -2px; }
  .chev { width: 16px; height: 16px; color: var(--text-muted); transition: transform 120ms ease; }
  details[open] .chev { transform: rotate(90deg); }
  .name { font-weight: 600; overflow-wrap: anywhere; }
  .name a.anchor { color: var(--text-muted); margin-left: 6px; font-weight: 400; visibility: hidden; }
  summary:hover .name a.anchor, .name a.anchor:focus { visibility: visible; }
  .stat { display: flex; flex-direction: column; align-items: flex-end; text-align: right; }
  .stat-label { font-size: 12px; color: var(--text-muted); }
  .stat-value { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .delta { font-size: 12px; margin-left: 6px; font-variant-numeric: tabular-nums; }
  .delta.better { color: var(--better); }
  .delta.worse { color: var(--worse); }
  .delta.flat { color: var(--text-muted); }

  .charts {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    padding: 4px 16px 16px 44px;
  }
  .card { border: 1px solid var(--border); border-radius: 8px; padding: 12px 12px 6px; position: relative; min-width: 0; }
  .card-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; margin-bottom: 4px; }
  .card-title { font-size: 13px; font-weight: 600; }
  .card-sub { font-size: 12px; color: var(--text-muted); font-weight: 400; margin-left: 4px; }
  .legend { display: flex; gap: 12px; font-size: 12px; color: var(--text-secondary); }
  .key { display: inline-block; width: 14px; height: 2px; border-radius: 1px; vertical-align: middle; margin-right: 5px; }
  .plot { position: relative; height: 180px; }
  .plot svg { display: block; width: 100%; height: 100%; overflow: visible; cursor: pointer; }
  .plot svg:focus { outline: none; }
  .plot svg:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; border-radius: 4px; }
  .plot text { font-size: 11px; fill: var(--text-muted); font-variant-numeric: tabular-nums; }
  .plot text.end-label { fill: var(--text-secondary); }
  .empty { color: var(--text-muted); font-size: 13px; padding: 24px 0; text-align: center; }

  .tip {
    position: absolute; z-index: 5; pointer-events: none;
    min-width: 180px; max-width: 280px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
    padding: 8px 10px;
    font-size: 12px;
    display: none;
  }
  .tip .tip-head { color: var(--text-secondary); margin-bottom: 6px; }
  .tip .tip-msg { color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tip .row { display: flex; align-items: center; gap: 6px; }
  .tip .row strong { font-variant-numeric: tabular-nums; font-weight: 650; color: var(--text-primary); }
  .tip .row span.lbl { color: var(--text-secondary); }
  .tip .hint { color: var(--text-muted); margin-top: 6px; }

  footer { margin-top: 32px; color: var(--text-muted); font-size: 13px; }

  @media (max-width: 720px) {
    summary { grid-template-columns: 16px minmax(0, 1fr) auto; }
    summary .stat.mem { display: none; }
    .charts { grid-template-columns: minmax(0, 1fr); padding-left: 16px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title">
      <h1>GraphQL-Ruby Benchmarks</h1>
      <p class="meta" id="meta">Loading…</p>
    </div>
    <div class="toolbar">
      <button type="button" id="expand-all">Expand all</button>
      <button type="button" id="collapse-all">Collapse all</button>
    </div>
  </header>
  <main id="main"></main>
  <footer>
    Runtime is measured with benchmark-ips on shared GitHub Actions runners, so expect some noise.
    Memory is measured with benchmark-memory.
    <a href="dev/bench/data.js">Raw data</a> ·
    <a href="https://github.com/rmosolgo/graphql-ruby-benchmarks">Repository</a>
  </footer>
</div>

<script src="dev/bench/data.js"></script>
<script>
(function () {
  "use strict";

  var SVG_NS = "http://www.w3.org/2000/svg";
  var MEMORY_KINDS = [
    { key: "memsize", title: "Memory", unit: "bytes" },
    { key: "objects", title: "Objects", unit: "objects" },
    { key: "strings", title: "Strings", unit: "strings" }
  ];

  // ---- formatting ----

  function fmtNumber(v) {
    var abs = Math.abs(v);
    if (abs >= 1000) return Math.round(v).toLocaleString("en-US");
    if (abs >= 100) return v.toFixed(0);
    if (abs >= 10) return v.toFixed(1);
    return v.toFixed(2);
  }

  function fmtBytes(v) {
    var units = ["B", "KB", "MB", "GB"];
    var i = 0;
    while (Math.abs(v) >= 1024 && i < units.length - 1) { v /= 1024; i++; }
    return (i === 0 ? String(Math.round(v)) : String(+v.toFixed(v >= 100 ? 0 : 1))) + " " + units[i];
  }

  function fmtValue(v, unit) {
    if (unit === "bytes") return fmtBytes(v);
    if (unit === "objects" || unit === "strings") return Math.round(v).toLocaleString("en-US");
    return fmtNumber(v) + (unit ? " " + unit : "");
  }

  function fmtAxis(v, unit) {
    if (unit === "bytes") return fmtBytes(v);
    if (Math.abs(v) >= 1e6) return +(v / 1e6).toFixed(1) + "M";
    if (Math.abs(v) >= 1e3) return +(v / 1e3).toFixed(1) + "k";
    return String(+v.toFixed(2));
  }

  function fmtDate(ms, withYear) {
    var opts = { month: "short", day: "numeric" };
    if (withYear) opts.year = "numeric";
    return new Date(ms).toLocaleDateString("en-US", opts);
  }

  function slugify(s) {
    return s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function svgEl(tag, attrs) {
    var e = document.createElementNS(SVG_NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  // ---- data ----

  // Turn BENCHMARK_DATA into one group per benchmark. Every entry set is read
  // (Runtime, Memory, Schema memory, ...), so new benchmarks show up on their own.
  // { name, slug, phase,
  //   runtime: [{commit, date, value}],
  //   memory: { memsize: { allocated: [...], retained: [...] }, ... },
  //   other: [{ label, unit, higherIsBetter, points }] }
  var MEMORY_RE = /^(.*) - (allocated|retained) (memsize|objects|strings)$/;

  function buildGroups(data) {
    var groups = new Map();
    function group(name) {
      if (!groups.has(name)) {
        groups.set(name, {
          name: name,
          slug: slugify(name),
          phase: name.split(" - ")[0].split(" ")[0],
          runtime: [],
          memory: {},
          other: []
        });
      }
      return groups.get(name);
    }
    function otherSeries(g, unit, higherIsBetter) {
      for (var i = 0; i < g.other.length; i++) {
        if (g.other[i].unit === unit) return g.other[i].points;
      }
      var series = { label: unit, unit: unit, higherIsBetter: higherIsBetter, points: [] };
      g.other.push(series);
      return series.points;
    }

    Object.keys(data.entries).forEach(function (setName) {
      data.entries[setName].forEach(function (entry) {
        entry.benches.forEach(function (b) {
          var point = { commit: entry.commit, date: entry.date, value: b.value };
          var m = MEMORY_RE.exec(b.name);
          if (entry.tool === "rubymemory" && m) {
            var kind = group(m[1]).memory[m[3]] || (group(m[1]).memory[m[3]] = { allocated: [], retained: [] });
            kind[m[2]].push(point);
          } else if (entry.tool === "rubyruntime" || b.unit === "i/s") {
            group(b.name).runtime.push(point);
          } else {
            var bigger = entry.tool === "customBiggerIsBetter" ||
              (entry.tool !== "customSmallerIsBetter" && /\/s$|per.?sec/i.test(b.unit));
            otherSeries(group(b.name), b.unit, bigger).push(point);
          }
        });
      });
    });

    // Sets are recorded separately, so keep every series in date order
    function byDate(a, b) { return a.date - b.date; }
    groups.forEach(function (g) {
      g.runtime.sort(byDate);
      Object.keys(g.memory).forEach(function (k) {
        g.memory[k].allocated.sort(byDate);
        g.memory[k].retained.sort(byDate);
      });
      g.other.forEach(function (o) { o.points.sort(byDate); });
    });

    return Array.from(groups.values());
  }

  function delta(points, higherIsBetter) {
    if (points.length < 2) return null;
    var last = points[points.length - 1].value;
    var prev = points[points.length - 2].value;
    if (prev === 0) return null;
    var pct = (last - prev) / prev * 100;
    var cls = Math.abs(pct) < 0.5 ? "flat" : ((pct > 0) === higherIsBetter ? "better" : "worse");
    var text = Math.abs(pct) < 0.05 ? "±0%" : (pct > 0 ? "▲ " : "▼ ") + Math.abs(pct).toFixed(1) + "%";
    return { cls: cls, text: text, title: "vs. previous run (" + (higherIsBetter ? "higher" : "lower") + " is better)" };
  }

  // ---- charts ----

  function niceStep(range, count) {
    var raw = range / count;
    var mag = Math.pow(10, Math.floor(Math.log10(raw)));
    var norm = raw / mag;
    return (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10) * mag;
  }

  function niceBytesStep(max, count) {
    // Prefer power-of-two-ish steps in the right unit so ticks read cleanly as KB/MB
    var unit = 1;
    while (max / unit >= 1024) unit *= 1024;
    return niceStep(max / unit, count) * unit;
  }

  // series: [{ label, color, points: [{commit, date, value}] }] sharing the same commits in order
  function renderChart(plot, series, unit) {
    plot.textContent = "";
    series = series.filter(function (s) { return s.points.length > 0; });
    if (series.length === 0) {
      plot.appendChild(el("div", "empty", "No data yet"));
      return;
    }
    var base = series[0].points;
    var width = plot.clientWidth;
    var height = plot.clientHeight;
    var multi = series.length > 1;
    var m = { top: 8, right: multi ? 64 : 12, bottom: 22, left: 52 };
    var w = Math.max(10, width - m.left - m.right);
    var h = height - m.top - m.bottom;
    var n = base.length;

    var max = 0;
    series.forEach(function (s) { s.points.forEach(function (p) { if (p.value > max) max = p.value; }); });
    if (max === 0) max = 1;
    var step = unit === "bytes" ? niceBytesStep(max, 4) : niceStep(max, 4);
    var top = Math.ceil(max * 1.05 / step) * step;

    function x(i) { return m.left + (n === 1 ? w / 2 : i * w / (n - 1)); }
    function y(v) { return m.top + h - (v / top) * h; }

    var svg = svgEl("svg", { viewBox: "0 0 " + width + " " + height, tabindex: "0", role: "img" });
    svg.setAttribute("aria-label", series.map(function (s) {
      return s.label + " latest " + fmtValue(s.points[s.points.length - 1].value, unit);
    }).join(", ") + ". Use arrow keys to step through commits, Enter to open a commit.");

    // gridlines + y ticks
    for (var t = 0; t <= top + step / 2; t += step) {
      var gy = y(t);
      svg.appendChild(svgEl("line", {
        x1: m.left, x2: m.left + w, y1: gy, y2: gy,
        stroke: t === 0 ? "var(--axis)" : "var(--grid)", "stroke-width": 1
      }));
      var lbl = svgEl("text", { x: m.left - 8, y: gy + 4, "text-anchor": "end" });
      lbl.textContent = fmtAxis(t, unit);
      svg.appendChild(lbl);
    }

    // x ticks: one per day at most, thinned out so labels don't overlap
    var minGap = 70;
    var lastX = -Infinity;
    var lastDay = null;
    base.forEach(function (p, i) {
      var day = fmtDate(p.date);
      if (day === lastDay || x(i) - lastX < minGap) return;
      lastDay = day;
      lastX = x(i);
      var anchor = n === 1 ? "middle" : (i === 0 ? "start" : "middle");
      var xl = svgEl("text", { x: x(i), y: height - 4, "text-anchor": anchor });
      xl.textContent = day;
      svg.appendChild(xl);
    });

    // lines + markers
    var markers = [];
    series.forEach(function (s) {
      var d = s.points.map(function (p, i) { return (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p.value).toFixed(1); }).join(" ");
      svg.appendChild(svgEl("path", {
        d: d, fill: "none", stroke: s.color, "stroke-width": 2,
        "stroke-linejoin": "round", "stroke-linecap": "round"
      }));
      if (n === 1) {
        svg.appendChild(svgEl("circle", { cx: x(0), cy: y(s.points[0].value), r: 3, fill: s.color }));
      }
      var mk = svgEl("circle", { r: 4, fill: s.color, stroke: "var(--surface)", "stroke-width": 2, visibility: "hidden" });
      svg.appendChild(mk);
      markers.push(mk);
    });

    // direct labels at line ends, nudged apart if they'd collide
    if (multi) {
      var ends = series.map(function (s) {
        return { s: s, y: y(s.points[s.points.length - 1].value) };
      }).sort(function (a, b) { return a.y - b.y; });
      for (var e = 1; e < ends.length; e++) {
        if (ends[e].y - ends[e - 1].y < 12) ends[e].y = ends[e - 1].y + 12;
      }
      ends.forEach(function (end) {
        var tl = svgEl("text", { x: m.left + w + 8, y: end.y + 4, "class": "end-label" });
        tl.textContent = end.s.label;
        svg.appendChild(tl);
      });
    }

    var cross = svgEl("line", { y1: m.top, y2: m.top + h, stroke: "var(--axis)", "stroke-width": 1, visibility: "hidden" });
    svg.insertBefore(cross, svg.firstChild.nextSibling);
    plot.appendChild(svg);

    var tip = el("div", "tip");
    plot.appendChild(tip);

    var active = -1;
    function show(i) {
      active = i;
      var cx = x(i);
      cross.setAttribute("x1", cx);
      cross.setAttribute("x2", cx);
      cross.setAttribute("visibility", "visible");
      series.forEach(function (s, si) {
        markers[si].setAttribute("cx", cx);
        markers[si].setAttribute("cy", y(s.points[i].value));
        markers[si].setAttribute("visibility", "visible");
      });

      var c = base[i].commit;
      tip.textContent = "";
      tip.appendChild(el("div", "tip-head", fmtDate(base[i].date, true) + " · " + c.id.slice(0, 7)));
      series.forEach(function (s) {
        var row = el("div", "row");
        var key = el("span", "key");
        key.style.background = s.color;
        row.appendChild(key);
        row.appendChild(el("strong", null, fmtValue(s.points[i].value, unit)));
        if (multi) row.appendChild(el("span", "lbl", s.label));
        tip.appendChild(row);
      });
      tip.appendChild(el("div", "tip-msg", (c.message || "").split("\n")[0]));
      tip.appendChild(el("div", "hint", "Click to open commit"));
      tip.style.display = "block";
      var tw = tip.offsetWidth;
      var left = cx + 12;
      if (left + tw > width) left = cx - 12 - tw;
      tip.style.left = Math.max(0, left) + "px";
      tip.style.top = "0px";
    }
    function hide() {
      active = -1;
      cross.setAttribute("visibility", "hidden");
      markers.forEach(function (mk) { mk.setAttribute("visibility", "hidden"); });
      tip.style.display = "none";
    }
    function indexAt(clientX) {
      var r = svg.getBoundingClientRect();
      var px = (clientX - r.left) * (width / r.width);
      if (n === 1) return 0;
      return Math.max(0, Math.min(n - 1, Math.round((px - m.left) / w * (n - 1))));
    }
    function open(i) {
      if (i >= 0) window.open(base[i].commit.url, "_blank", "noopener");
    }

    svg.addEventListener("pointermove", function (ev) { show(indexAt(ev.clientX)); });
    svg.addEventListener("pointerleave", hide);
    svg.addEventListener("click", function (ev) { open(indexAt(ev.clientX)); });
    svg.addEventListener("focus", function () { show(n - 1); });
    svg.addEventListener("blur", hide);
    svg.addEventListener("keydown", function (ev) {
      if (ev.key === "ArrowLeft") { show(Math.max(0, active - 1)); ev.preventDefault(); }
      else if (ev.key === "ArrowRight") { show(Math.min(n - 1, active + 1)); ev.preventDefault(); }
      else if (ev.key === "Home") { show(0); ev.preventDefault(); }
      else if (ev.key === "End") { show(n - 1); ev.preventDefault(); }
      else if (ev.key === "Enter") { open(active); }
      else if (ev.key === "Escape") { hide(); }
    });
  }

  function chartCard(title, sub, series, unit) {
    var card = el("div", "card");
    var head = el("div", "card-head");
    var t = el("div", "card-title", title);
    if (sub) t.appendChild(el("span", "card-sub", sub));
    head.appendChild(t);
    if (series.length > 1) {
      var legend = el("div", "legend");
      series.forEach(function (s) {
        var item = el("span");
        var key = el("span", "key");
        key.style.background = s.color;
        item.appendChild(key);
        item.appendChild(document.createTextNode(s.label));
        legend.appendChild(item);
      });
      head.appendChild(legend);
    }
    card.appendChild(head);
    var plot = el("div", "plot");
    card.appendChild(plot);
    return { card: card, draw: function () { renderChart(plot, series, unit); } };
  }

  // ---- page ----

  function statBlock(cls, label, points, unit, higherIsBetter) {
    var stat = el("div", "stat " + cls);
    stat.appendChild(el("span", "stat-label", label));
    var val = el("span", "stat-value");
    if (points.length) {
      val.textContent = fmtValue(points[points.length - 1].value, unit);
      var d = delta(points, higherIsBetter);
      if (d) {
        var ds = el("span", "delta " + d.cls, d.text);
        ds.title = d.title;
        val.appendChild(ds);
      }
    } else {
      val.textContent = "—";
    }
    stat.appendChild(val);
    return stat;
  }

  var chevron = '<svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function renderGroup(g) {
    var details = el("details");
    details.id = g.slug;

    var summary = el("summary");
    summary.insertAdjacentHTML("beforeend", chevron);
    var name = el("div", "name", g.name);
    var anchor = el("a", "anchor", "#");
    anchor.href = "#" + g.slug;
    anchor.title = "Link to this benchmark";
    anchor.setAttribute("aria-label", "Link to " + g.name);
    anchor.addEventListener("click", function (ev) { ev.stopPropagation(); });
    name.appendChild(anchor);
    summary.appendChild(name);
    // Two stat columns: runtime (or another headline metric) and allocated memory
    var mem = g.memory.memsize;
    if (g.runtime.length) {
      summary.appendChild(statBlock("rt", "Runtime", g.runtime, "i/s", true));
    } else if (g.other.length) {
      var o = g.other[0];
      summary.appendChild(statBlock("rt", o.label, o.points, o.unit, o.higherIsBetter));
    } else {
      summary.appendChild(el("div", "stat rt"));
    }
    if (mem && mem.allocated.length) {
      summary.appendChild(statBlock("mem", "Allocated memory", mem.allocated, "bytes", false));
    } else {
      summary.appendChild(el("div", "stat mem"));
    }
    details.appendChild(summary);

    var charts = el("div", "charts");
    var cards = [];
    if (g.runtime.length) {
      cards.push(chartCard("Runtime", "iterations/sec, higher is better",
        [{ label: "i/s", color: "var(--series-1)", points: g.runtime }], "i/s"));
    }
    g.other.forEach(function (o) {
      cards.push(chartCard(o.label, o.higherIsBetter ? "higher is better" : "lower is better",
        [{ label: o.label, color: "var(--series-1)", points: o.points }], o.unit));
    });
    MEMORY_KINDS.forEach(function (kind) {
      var data = g.memory[kind.key];
      if (!data) return;
      cards.push(chartCard(kind.title, kind.unit + ", lower is better", [
        { label: "allocated", color: "var(--series-1)", points: data.allocated },
        { label: "retained", color: "var(--series-2)", points: data.retained }
      ], kind.unit));
    });
    cards.forEach(function (c) { charts.appendChild(c.card); });
    details.appendChild(charts);

    function drawAll() { cards.forEach(function (c) { c.draw(); }); }
    details.addEventListener("toggle", function () {
      // Expand/collapse all shouldn't rewrite the URL
      var bulk = details.dataset.bulk === "1";
      delete details.dataset.bulk;
      if (details.open) {
        drawAll();
        if (bulk) return;
        if (location.hash !== "#" + g.slug) history.replaceState(null, "", "#" + g.slug);
      } else if (!bulk && location.hash === "#" + g.slug) {
        history.replaceState(null, "", location.pathname + location.search);
      }
    });
    if (window.ResizeObserver) {
      var lastWidth = 0;
      new ResizeObserver(function () {
        if (details.open && charts.clientWidth !== lastWidth) {
          lastWidth = charts.clientWidth;
          drawAll();
        }
      }).observe(charts);
    }
    return details;
  }

  function openFromHash() {
    var slug = decodeURIComponent(location.hash.slice(1));
    if (!slug) return;
    var target = document.getElementById(slug);
    if (target && target.tagName === "DETAILS") {
      target.open = true;
      target.scrollIntoView({ block: "start" });
    }
  }

  function init() {
    var data = window.BENCHMARK_DATA;
    var meta = document.getElementById("meta");
    var main = document.getElementById("main");
    if (!data) {
      meta.textContent = "Couldn't load benchmark data.";
      return;
    }

    var commits = {};
    Object.keys(data.entries).forEach(function (setName) {
      data.entries[setName].forEach(function (entry) { commits[entry.commit.id] = true; });
    });
    var runs = Object.keys(commits).length;
    meta.textContent = "";
    meta.appendChild(document.createTextNode("Tracking "));
    var repo = el("a", null, "rmosolgo/graphql-ruby");
    repo.href = data.repoUrl;
    meta.appendChild(repo);
    meta.appendChild(document.createTextNode(
      " · " + runs + " runs · last updated " + fmtDate(data.lastUpdate, true) +
      ". Changes are vs. the previous run."
    ));

    var groups = buildGroups(data);
    var phases = new Map();
    groups.forEach(function (g) {
      if (!phases.has(g.phase)) phases.set(g.phase, []);
      phases.get(g.phase).push(g);
    });
    phases.forEach(function (list, phase) {
      main.appendChild(el("h2", null, phase));
      var box = el("div", "list");
      list.forEach(function (g) { box.appendChild(renderGroup(g)); });
      main.appendChild(box);
    });

    document.getElementById("expand-all").addEventListener("click", function () {
      document.querySelectorAll("details").forEach(function (d) {
        if (d.open !== true) { d.dataset.bulk = "1"; d.open = true; }
      });
    });
    document.getElementById("collapse-all").addEventListener("click", function () {
      document.querySelectorAll("details").forEach(function (d) {
        if (d.open !== false) { d.dataset.bulk = "1"; d.open = false; }
      });
    });

    openFromHash();
    window.addEventListener("hashchange", openFromHash);
  }

  init();
})();
</script>
</body>
</html>
